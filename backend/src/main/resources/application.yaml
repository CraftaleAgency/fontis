spring:
  application:
    name: fontis-backend
  datasource:
    url: ${FONTIS_DB_URL:jdbc:postgresql://localhost:5432/fontis}
    username: ${FONTIS_DB_USER:fontis}
    password: ${FONTIS_DB_PASSWORD:fontis}
  batch:
    job:
      enabled: false
  ai:
    model:
      # Local models through Ollama. Mistral (EU provider) will be added for the cloud comparison.
      chat: ollama
      embedding: ollama
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${FONTIS_OLLAMA_CHAT:qwen3:14b}
          temperature: 0.1
      embedding:
        options:
          model: ${FONTIS_OLLAMA_EMBEDDING:bge-m3}

fontis:
  ingest:
    # Output of `fontis-bench corpus build`, relative to backend/.
    corpus-dir: ${FONTIS_CORPUS_DIR:../data/corpus}
    # Units per transaction; each one embeds every chunk of those units in one call.
    units-per-batch: 16
  ask:
    # Chunks taken from each of vector and full-text search before fusion.
    candidates: 40
    # Units (articles, recitals, annexes) given to the model as numbered sources.
    max-sources: 6
    # Below this cosine similarity of the best chunk, answer "no source" without calling the model.
    min-similarity: 0.45
    # Context window for the chat model; sources plus answer fit well within it.
    num-ctx: 8192
    # Ranking weights, chosen with the v1 benchmark (docs/benchmark/v1.md): down-weighting recitals
    # brought Hit@1 from 68% to 79%; full-text search did not help on paraphrased questions, so it is
    # off by default (a weight of 0 skips it) and kept as an option.
    text-weight: 0.0
    recital-weight: 0.6
    sum-languages: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
