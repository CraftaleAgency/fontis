spring:
  application:
    name: fontis-backend
  datasource:
    url: ${FONTIS_DB_URL:jdbc:postgresql://localhost:5432/fontis}
    username: ${FONTIS_DB_USER:fontis}
    password: ${FONTIS_DB_PASSWORD:fontis}
    hikari:
      # With a document filter, keep scanning the HNSW index until enough allowed chunks are found
      # (pgvector >= 0.8) instead of returning fewer results.
      connection-init-sql: SET hnsw.iterative_scan = strict_order
  batch:
    job:
      enabled: false
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 26MB
  http:
    clients:
      # The model server must answer or fail within a bounded time: the JDK client has no stale
      # pooled connections, and the read timeout stays below a reverse proxy's 100 seconds.
      imperative:
        factory: jdk
      connect-timeout: 5s
      read-timeout: ${FONTIS_MODEL_READ_TIMEOUT:90s}
  ai:
    retry:
      # One quick retry for a dropped connection; the default (10 attempts, backing off to 3 minutes)
      # would keep a request and the GPU busy for many minutes.
      max-attempts: 2
      backoff:
        initial-interval: 500ms
        multiplier: 2
        max-interval: 2s
    model:
      # Local models through Ollama. Mistral (EU provider) will be added for the cloud comparison.
      chat: ollama
      embedding: ollama
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${FONTIS_OLLAMA_CHAT:qwen3:14b}
          temperature: 0.1
      embedding:
        options:
          model: ${FONTIS_OLLAMA_EMBEDDING:bge-m3}

fontis:
  # Traces for Langfuse, see docs/observability.md. Questions, sources and answers are not sent unless enabled.
  tracing:
    environment: ${FONTIS_ENVIRONMENT:development}
    capture-content: ${FONTIS_TRACING_CAPTURE_CONTENT:false}
  ingest:
    # Output of `fontis-bench corpus build`, relative to backend/.
    corpus-dir: ${FONTIS_CORPUS_DIR:../data/corpus}
    # Units per transaction; each one embeds every chunk of those units in one call.
    units-per-batch: 16
  ask:
    # Chunks taken from each of vector and full-text search before fusion.
    candidates: 40
    # Units (articles, recitals, annexes) given to the model as numbered sources.
    max-sources: 6
    # Below this cosine similarity of the best chunk, answer "no source" without calling the model.
    min-similarity: 0.45
    # Questions per client per minute (0 = no limit), so a public demo cannot saturate the GPU.
    rate-limit-per-minute: ${FONTIS_RATE_LIMIT_PER_MINUTE:20}
    # Context window for the chat model; sources plus answer fit well within it.
    num-ctx: 8192
    # Tokens the model may generate: an answer of six sentences needs far fewer.
    num-predict: 1024
    # Answers generated at the same time; further questions get 503 instead of queueing on the GPU.
    max-concurrent: ${FONTIS_MAX_CONCURRENT_ANSWERS:2}
    # Characters of each source given to the model, from several chunks of the article: 6 × 2,400
    # stays within num-ctx, so the chat and embedding models still fit together on a 12 GB GPU.
    max-source-chars: 2400
    # Ranking weights, chosen with the v1 benchmark (docs/benchmark/v1.md): down-weighting recitals
    # brought Hit@1 from 68% to 79%; full-text search did not help on paraphrased questions, so it is
    # off by default (a weight of 0 skips it) and kept as an option.
    text-weight: 0.0
    recital-weight: 0.6
    sum-languages: false

  auth:
    # Failed login attempts per client per minute (0 = no limit).
    login-attempts-per-minute: ${FONTIS_LOGIN_ATTEMPTS_PER_MINUTE:5}
  admin:
    # First administrator, created at startup when there are no users yet.
    email: ${FONTIS_ADMIN_EMAIL:}
    password: ${FONTIS_ADMIN_PASSWORD:}
  documents:
    # Uploaded files are split into sections of about this size (PDFs are split into pages).
    section-chars: 3000
  log:
    # Answer log entries are deleted after this many days (questions may contain personal data).
    retention-days: ${FONTIS_LOG_RETENTION_DAYS:30}
    cleanup-cron: "0 30 3 * * *"

server:
  servlet:
    session:
      timeout: 8h
      cookie:
        same-site: lax
        # Set to true behind HTTPS (the Docker stack does).
        secure: ${FONTIS_COOKIE_SECURE:false}
  # Client address from X-Forwarded-For when the request comes through the proxies (private networks).
  forward-headers-strategy: native

management:
  # Actuator (health, Prometheus metrics) on an internal port that the reverse proxy does not expose.
  server:
    port: ${FONTIS_MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: fontis
  # Traces (including Spring AI's model and embedding spans) go to an OTLP endpoint such as Langfuse.
  # Prompts and completions are not included (spring.ai.chat.observations.log-prompt stays false).
  tracing:
    export:
      enabled: ${FONTIS_TRACING_ENABLED:false}
    sampling:
      probability: ${FONTIS_TRACING_SAMPLING:1.0}
  otlp:
    # Metrics are scraped by Prometheus and logs stay local: only traces are pushed.
    metrics:
      export:
        enabled: false
    logging:
      export:
        enabled: false
  opentelemetry:
    tracing:
      export:
        otlp:
          # Langfuse: https://<langfuse-host>/api/public/otel/v1/traces
          endpoint: ${FONTIS_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
          headers:
            # Langfuse: "Basic " + base64("<public key>:<secret key>")
            Authorization: ${FONTIS_OTLP_AUTHORIZATION:}
            # Langfuse v4 shows the spans in real time; other OpenTelemetry backends ignore it.
            x-langfuse-ingestion-version: "4"
